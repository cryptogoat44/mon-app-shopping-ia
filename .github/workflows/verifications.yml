# Vérifications automatiques de Spotto (Lot Q, bloc 4 — décision 4 du
# fondateur). Lancées à chaque push sur `main` ou une branche `lot-…`, sur chaque pull request
# interne au dépôt, et à la demande (onglet Actions → « Run workflow »).
#
# Règles (décision du fondateur, à ne jamais assouplir) :
# - clés de spotto-dev UNIQUEMENT : jamais de clé de production, jamais de
#   clé SerpApi (une valeur factice suffit, les tests simulent SerpApi) ;
# - jamais `pull_request_target` : une pull request venue d'un autre dépôt
#   ne reçoit aucune clé et ne lance pas les tests serveur ;
# - les clés sont des secrets GitHub ajoutés par le fondateur lui-même ;
#   rien n'est affiché dans les journaux (GitHub masque aussi les secrets) ;
# - droits en lecture seule, aucun déploiement (Render reste manuel).
name: Vérifications

on:
  push:
    # `lot-…` : branches de travail, poussées par le fondateur seul.
    branches: [main, "lot-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push annule la vérification encore en cours sur la même branche.
concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tout ce qui se vérifie sans aucune clé.
  code:
    name: Types, tests de l'app, compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Installation (versions figées)
        run: pnpm install --frozen-lockfile

      - name: Serveur — vérification des types (code, tests et scripts)
        working-directory: apps/backend
        run: |
          pnpm run typecheck
          pnpm run typecheck:tests

      - name: Serveur — compilation (comme sur Render)
        working-directory: apps/backend
        run: pnpm run build

      - name: Serveur — sharp se charge depuis le serveur compilé (Linux)
        working-directory: apps/backend
        run: |
          node --input-type=module -e "
            const sharp = (await import('sharp')).default;
            console.log('Node', process.version, '— sharp', sharp.versions.sharp, '— libvips', sharp.versions.vips);
            await import('./dist/lib/imageProcessing.js');
            await import('./dist/lib/photos.js');
            console.log('Modules d’images chargés.');
          "

      - name: App — types des routes (générés par Expo, non enregistrés dans Git)
        working-directory: apps/mobile
        run: |
          CI=1 npx expo start --web --port 8099 > /dev/null 2>&1 &
          for i in $(seq 1 60); do
            [ -f .expo/types/router.d.ts ] && break
            sleep 2
          done
          pkill -f "expo start --web --port 8099" || true
          test -f .expo/types/router.d.ts || { echo "Types des routes non générés."; exit 1; }

      - name: App — vérification des types
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: App — tests
        working-directory: apps/mobile
        run: pnpm run test

      # Adresses publiques exigées par l'app pour compiler ; la compilation
      # ne contacte rien, la clé publique peut donc être factice.
      - name: Site web — compilation
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:3000
          EXPO_PUBLIC_SUPABASE_URL: https://sbtwsmxfdfxzgcohbznd.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_factice-ci
        run: pnpm run build:web

  # Tests serveur contre spotto-dev : seul job qui reçoit une clé.
  tests-serveur:
    name: Tests serveur (spotto-dev)
    # Jamais pour une pull request venue d'un autre dépôt (elle n'aurait pas
    # la clé de toute façon) : le job est sauté, pas en échec.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Installation (versions figées)
        run: pnpm install --frozen-lockfile --filter backend...

      # Le script refuse de démarrer si l'adresse n'est pas celle de
      # spotto-dev, et relance une seule fois un fichier en échec réseau.
      - name: Tests serveur (relance unique d'un échec réseau)
        working-directory: apps/backend
        env:
          SUPABASE_URL: https://sbtwsmxfdfxzgcohbznd.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SPOTTO_DEV_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SPOTTO_DEV_PUBLISHABLE_KEY }}
          SERPAPI_KEY: cle-factice-ci-jamais-valide
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SPOTTO_DEV_SERVICE_ROLE_KEY / SPOTTO_DEV_PUBLISHABLE_KEY absents : voir la procédure du bloc 4."
            exit 1
          fi
          pnpm run test:ci
