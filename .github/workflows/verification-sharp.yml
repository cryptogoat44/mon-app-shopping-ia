# Vérifie que la bibliothèque d'images « sharp » s'installe et fonctionne sur
# Linux avec la version de Node utilisée par Render — sans rien déployer.
#
# Règles (décision du fondateur, Lot Q) : AUCUNE clé secrète dans ce job,
# jamais d'accès à la production ni à SerpApi, jamais
# `pull_request_target`, droits en lecture seule.
name: Vérification sharp (Linux)

on:
  push:
    branches: [lot-s-spotter]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sharp-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Installation (comme sur Render, versions figées)
        run: pnpm install --frozen-lockfile --filter backend...

      - name: Compilation du serveur (comme sur Render)
        run: pnpm run build

      - name: sharp se charge depuis le serveur compilé
        run: |
          node --input-type=module -e "
            const sharp = (await import('sharp')).default;
            console.log('Node', process.version, '— sharp', sharp.versions.sharp, '— libvips', sharp.versions.vips);
            await import('./dist/lib/imageProcessing.js');
            console.log('Module de recadrage chargé.');
          "

      - name: Recadrage réel (tests du module d'images, sans réseau ni clé)
        run: pnpm exec vitest run tests/imageProcessing.test.ts
