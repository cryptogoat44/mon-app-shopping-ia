# Photo choisie (photothèque, sans demande d'autorisation) → écran unique du
# Spotter (lot 4 ter) : « Entourez la pièce » d'emblée (option B),
# « Que cherchez-vous ? », « Lancer » → identification : clé SerpApi invalide,
# donc échec technique attendu — jamais « pièce introuvable ». Puis
# « Recadrer » et nouvelle identification. Lot entourer la pièce : plus de
# cadre à poignées ; Maestro ne trace que des lignes droites (un trait n'est
# pas retenu), donc « Utiliser toute l'image » avant de lancer.
appId: com.spottoapp.ios
---
- tapOn: "Ajouter une photo"
- extendedWaitUntil:
    visible: "Collections"
    timeout: 15000
- takeScreenshot: 03-phototheque-sans-autorisation
- tapOn:
    point: "50%,25%"
- extendedWaitUntil:
    visible: "Entourez la pièce"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-photo-cadre
- tapOn: "Utiliser toute l'image"
- tapOn:
    id: "spot-query"
- inputText: "veste"
- runFlow:
    when:
      visible: "Plus tard"
    commands:
      - tapOn: "Plus tard"
- tapOn: "Lancer"
- extendedWaitUntil:
    visible: "La recherche n'a pas abouti"
    timeout: 60000
- takeScreenshot: 05-identification-echec-technique
- tapOn: "Recadrer"
- extendedWaitUntil:
    visible: "Entourez la pièce"
    timeout: 30000
- takeScreenshot: 05b-recadrage
- tapOn: "Utiliser toute l'image"
- takeScreenshot: 05c-recadrage-ajuste
- tapOn: "Lancer l'identification"
- extendedWaitUntil:
    visible: "La recherche n'a pas abouti"
    timeout: 60000
- takeScreenshot: 06-identification-echec-technique
