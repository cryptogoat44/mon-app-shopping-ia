# Photo choisie (photothèque, sans demande d'autorisation) → écran unique du
# Spotter (lot 4 ter) : cadre « Entourez la pièce » d'emblée (option B),
# « Que cherchez-vous ? », « Lancer » → identification : clé SerpApi invalide,
# donc échec technique attendu — jamais « pièce introuvable ». Puis
# « Recadrer » : recadrage (coin, déplacement, réinitialisation) et nouvelle
# identification.
appId: com.spottoapp.ios
---
- tapOn: "Ajouter une photo"
- extendedWaitUntil:
    visible: "Collections"
    timeout: 15000
- takeScreenshot: 03-phototheque-sans-autorisation
- tapOn:
    point: "50%,25%"
- extendedWaitUntil:
    visible: "Entourez la pièce"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-photo-cadre
- swipe:
    start: "26%,29%"
    end: "36%,37%"
    duration: 1000
- tapOn:
    id: "spot-query"
- inputText: "veste"
- runFlow:
    when:
      visible: "Plus tard"
    commands:
      - tapOn: "Plus tard"
- tapOn: "Lancer"
- extendedWaitUntil:
    visible: "La recherche n'a pas abouti"
    timeout: 60000
- takeScreenshot: 05-identification-echec-technique
- tapOn: "Recadrer"
- extendedWaitUntil:
    visible: "Entourez la pièce"
    timeout: 30000
- takeScreenshot: 05b-recadrage
- swipe:
    start: "23%,30%"
    end: "33%,38%"
    duration: 1000
- swipe:
    start: "55%,52%"
    end: "45%,58%"
    duration: 1000
- takeScreenshot: 05c-recadrage-ajuste
- tapOn: "Réinitialiser le cadre"
- tapOn: "Lancer l'identification"
- extendedWaitUntil:
    visible: "La recherche n'a pas abouti"
    timeout: 60000
- takeScreenshot: 06-identification-echec-technique
