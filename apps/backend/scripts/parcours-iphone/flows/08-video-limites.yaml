# Lot 4, une fois (français) : vidéo trop longue (message clair), vidéo HEVC
# (format par défaut des iPhone : lue), puis identification lancée avec
# l'image choisie — clé SerpApi invalide : échec technique attendu, aucun crédit.
appId: com.spottoapp.ios
---
- tapOn: "Importer une vidéo"
- extendedWaitUntil:
    visible: "Collections"
    timeout: 20000
- tapOn: "Vidéo, un minute.*"
- extendedWaitUntil:
    visible: "Cette vidéo dure 1:05.*"
    timeout: 30000
- takeScreenshot: 05-trop-longue
- tapOn: "Importer une vidéo"
- extendedWaitUntil:
    visible: "Collections"
    timeout: 20000
- tapOn:
    text: "Vidéo, douze.*"
    index: 0
- extendedWaitUntil:
    visible: "0:00 / 0:12"
    timeout: 30000
- swipe:
    start: "8%,71%"
    end: "50%,71%"
    duration: 1500
- extendedWaitUntil:
    visible: "0:06 / 0:12"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 09-hevc
- tapOn: "Utiliser cette image"
- extendedWaitUntil:
    visible: "Entourez la pièce"
    timeout: 30000
- tapOn: "Lancer l'identification"
- extendedWaitUntil:
    visible: "La recherche n'a pas abouti"
    timeout: 60000
- takeScreenshot: 06-identification
- tapOn: "Fermer"
- extendedWaitUntil:
    visible: "Importer une vidéo"
    timeout: 15000
