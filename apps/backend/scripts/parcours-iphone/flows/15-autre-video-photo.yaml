# Lot 4 ter (français) : une autre vidéo, choisie d'un geste dans le sélecteur
# d'iOS (il suit la langue de l'iPhone) → écran unique, champ prêt à la saisie
# → « Lancer » → résultats. Puis une photo : même écran, sans IA, avec d'emblée
# le cadre « Entourez la pièce » (option B du fondateur) : coin tiré, mots,
# « Lancer ».
appId: com.spottoapp.ios
---
- tapOn: "Choisir une autre vidéo"
- extendedWaitUntil:
    visible: "Collections"
    timeout: 20000
- tapOn:
    text: "Vidéo, douze.*"
    index: 1
- extendedWaitUntil:
    visible: "Que cherchez-vous \\?"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 09-autre-video-question
- inputText: "veste en daim marron"
- tapOn: "Lancer"
- extendedWaitUntil:
    visible: "Meilleure proposition"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 10-autre-video-resultats
- tapOn: "Fermer"
- extendedWaitUntil:
    visible: "Ajouter une photo"
    timeout: 20000
- tapOn: "Ajouter une photo"
- extendedWaitUntil:
    visible: "Collections"
    timeout: 20000
- tapOn:
    point: "50%,25%"
- extendedWaitUntil:
    visible: "Entourez la pièce"
    timeout: 30000
- assertVisible: "Que cherchez-vous \\?"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 11-photo-cadre
# Coin en haut à gauche du cadre (zone centrale de la photo) tiré vers l'intérieur.
- swipe:
    start: "26%,29%"
    end: "36%,37%"
    duration: 1000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 11b-photo-cadre-ajuste
- tapOn:
    id: "spot-query"
- inputText: "veste"
# Clavier ouvert : « Lancer » reste visible au-dessus (défaut corrigé : il était caché dessous).
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 11c-photo-mots-clavier
- assertVisible: "Lancer"
- tapOn: "Lancer"
- extendedWaitUntil:
    visible: "Meilleure proposition"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 12-photo-resultats
- tapOn: "Fermer"
- extendedWaitUntil:
    visible: "Ajouter une photo"
    timeout: 20000
