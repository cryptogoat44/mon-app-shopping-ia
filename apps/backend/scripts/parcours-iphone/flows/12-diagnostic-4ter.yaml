# Lot 4 ter — étape 0, diagnostic (demande du fondateur, 2026-10-07) :
# parcours actuel « une vidéo et quelques mots » au premier usage, sur l'app
# iPhone (simulateur), depuis Spotter jusqu'aux résultats. Une capture par
# écran. IA SIMULÉE (aucun appel réel) ; clé SerpApi invalide (aucun crédit) :
# le dernier écran montre l'échec de l'identification à la place des pièces.
appId: com.spottoapp.ios
---
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-spotter
- tapOn: "Importer une vidéo"
- extendedWaitUntil:
    visible: "Collections"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-selecteur-ios
- tapOn:
    text: "Vidéo, douze.*"
    index: 1
- extendedWaitUntil:
    visible: "Que cherchez-vous \\?"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-que-cherchez-vous
- tapOn:
    id: "video-auto-query"
- inputText: "veste en daim marron"
- takeScreenshot: 04-description-tapee
- pressKey: Enter
- extendedWaitUntil:
    visible: "Analyse automatique de la vidéo"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-accord
- tapOn: "Accepter"
- extendedWaitUntil:
    visible: "Recherche de la pièce…"
    timeout: 15000
    optional: true
- takeScreenshot: 06-attente-analyse
- extendedWaitUntil:
    visible: "Spotto parcourt les boutiques…"
    timeout: 60000
    optional: true
- takeScreenshot: 07-identification
- extendedWaitUntil:
    visible: "La recherche n'a pas abouti"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08-resultats
- tapOn: "Fermer"
- extendedWaitUntil:
    visible: "Importer une vidéo"
    timeout: 15000
